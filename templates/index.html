<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartNova - Smart Shopping</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>CartNova</h1>

        <input type="text" placeholder="Search for products...">

        <button>Login</button>
        <button>🛒 Cart</button>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="#">Electronics</a>
        <a href="#">Fashion</a>
        <a href="#">Mobiles</a>
        <a href="#">Home & Kitchen</a>
    </nav>

    <main>

        <section class="hero">
            <h2>Welcome to CartNova</h2>
            <p>Find everything you need at the best prices.</p>
            <button>Shop Now</button>
        </section>

        <section class="products">
            <h2>Featured Products</h2>

            <div class="product-container">

                <div class="product-image">
    <img src="{{ url_for('static', filename='images/mobile.jpg') }}" alt="Smartphone">
</div>
                    <h3>Smartphone</h3>
                    <p>₹19,999</p>
                    <button>Add to Cart</button>
                </div>

                <div class="product-image">
    <img src="{{ url_for('static', filename='images/laptop.jpg') }}" alt="Laptop">
</div>
                    <h3>Laptop</h3>
                    <p>₹49,999</p>
                    <button>Add to Cart</button>
                </div>

                <div class="product-image">
    <img src="{{ url_for('static', filename='images/headphones.jpg') }}" alt="Headphones">
</div>
                    <h3>Headphones</h3>
                    <p>₹2,499</p>
                    <button>Add to Cart</button>
                </div>

                <div class="product-image">
    <img src="{{ url_for('static', filename='images/watch.jpg') }}" alt="Smart Watch">
</div>
                    <h3>Smart Watch</h3>
                    <p>₹3,999</p>
                    <button>Add to Cart</button>
                </div>

            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 CartNova. All rights reserved.</p>
    </footer>

</body>
</html>
